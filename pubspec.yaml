name: leather_care_admin
description: "Deri Urun Bakim Onarim Takip Sistemi - Windows Admin Panel"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- State Management & Dependency Injection ---
  flutter_bloc: ^8.1.3
  get_it: ^7.6.0
  go_router: ^14.2.7

  # --- Network & Serialization (S3 / MinIO Uyumlu) ---
  dio: ^5.4.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # --- Güvenli Yerel Depolama (Windows Registry Entegrasyonu) ---
  flutter_secure_storage: ^9.0.0

  # --- Windows Native Entegrasyon Araçları ---
  window_manager: ^0.3.8         # Pencere boyutlandırma, sürükleme, sabitleme
  file_picker: ^8.0.0            # Arşivleri yerel diske indirmek ve seçmek için
  path_provider: ^2.1.1          # Windows üzerindeki özel klasör yollarına erişim

  # --- UI Yardımcıları & Formatlama ---
  percent_indicator: ^4.2.3      # Medya yükleme ve indirme işlemleri için progress bar'lar
  intl: ^0.19.0                  # Para birimi ve Türkçe tarih formatlama
  mime: ^2.0.0
  path: ^1.9.1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  crypto: ^3.0.7

  # --- Fiş Yazdırma (F4): Windows RAW spooler + LAN TCP 9100 ---
  win32: ^5.15.0
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # --- Kod Üreticileri (Build Runner) ---
  build_runner: ^2.4.8
  flutter_lints: ^6.0.0
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  # Gelecekte ekleyeceğimiz ikonlar veya yerel varlıklar için şimdiden hazır tutalım
  assets:
    - assets/